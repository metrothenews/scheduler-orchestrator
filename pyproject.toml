[project]
name = "scheduler-orchestrator"
version = "0.1.0"
description = "Cloud Run service + job that reads Script View via sheets-json and schedules via post-executor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "httpx>=0.26,<1.0",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1,<3.0",
  "python-dateutil>=2.9.0",
  "google-auth>=2.28,<3.0",
  "tenacity>=8.2,<9.0",
]

[project.scripts]
scheduler-orchestrator-job = "scheduler_orchestrator.job:main"

[tool.uv]
package = true
